---
version: 2.1
orbs:
  samvera: samvera/circleci-orb@1.0
jobs:
  bundle_lint_test:
    parameters:
      ruby_version:
        type: string
      bundler_version:
        type: string
        default: 2.4.5
      rails_version:
        type: string
      solr_config_path:
        type: string
        default: '.internal_test_app/solr/conf'
    executor:
      name: 'samvera/ruby_fcrepo_solr'
      ruby_version: << parameters.ruby_version >>
      solr_version: 9-slim
    environment:
      ENGINE_CART_RAILS_OPTIONS: --skip-git --skip-bundle --skip-listen --skip-spring --skip-keeps --skip-coffee --skip-puma --skip-test --skip-docker --skip-active-storage
      RAILS_VERSION: << parameters.rails_version >>
      NOKOGIRI_USE_SYSTEM_LIBRARIES: true
      CC_TEST_REPORTER_ID: e52010675d2774ee408c14c0de08c143d0749e59beb6dd729254d1b3ea94c7b1
      BLACKLIGHT_VERSION: 7.29
    steps:
      - samvera/cached_checkout
      - run:
         name: Check for a branch named 'master'
         command: |
           git fetch --all --quiet --prune --prune-tags
           if [[ -n "$(git branch --all --list master */master)" ]]; then
             echo "A branch named 'master' was found. Please remove it."
             echo "$(git branch --all --list master */master)"
           fi
           [[ -z "$(git branch --all --list master */master)" ]]
      - samvera/bundle:
          ruby_version: << parameters.ruby_version >>
          bundler_version: << parameters.bundler_version >>
          cache_version: '4'
      - samvera/engine_cart_generate:
          cache_key: v7-internal-test-app-{{ checksum "hydra-editor.gemspec" }}-{{ checksum "Gemfile" }}-{{ checksum "spec/test_app_templates/lib/generators/test_app_generator.rb" }}-<< parameters.rails_version >>-<< parameters.ruby_version >>
      - run:
          name: Fix test app's Gemfile
          command: sed -i 's/\(^.*error_highlight.*$\)/# \1/' .internal_test_app/Gemfile
      - samvera/install_solr_core:
          solr_config_path: << parameters.solr_config_path >>
      - samvera/bundle:
          ruby_version: << parameters.ruby_version >>
          bundler_version: << parameters.bundler_version >>
          cache_version: '3'
      - run: yarn install
      - samvera/rubocop
      - samvera/parallel_rspec

workflows:
  version: 2
  ci:
    jobs:
      # Ruby 4.0 releases
      - bundle_lint_test:
          name: bundle_ruby4-0_rails8-1
          ruby_version: 4.0.7
          rails_version: 8.1.4
      # Ruby 3.4 releases
      - bundle_lint_test:
          name: bundle_ruby3-4_rails8-1
          ruby_version: 3.4.11
          rails_version: 8.1.4
      # Ruby 3.3 releases
      - bundle_lint_test:
          name: bundle_ruby3-3_rails8-1
          ruby_version: 3.3.12
          rails_version: 8.1.4
      - bundle_lint_test:
          name: bundle_ruby3-3_rails8-0
          ruby_version: 3.3.12
          rails_version: 8.0.5.1
      - bundle_lint_test:
          name: bundle_ruby3-3_rails7-2
          ruby_version: 3.3.12
          rails_version: 7.2.4
      # Ruby 3.2 releases
      - bundle_lint_test:
          name: bundle_ruby3-2_rails8-0
          ruby_version: 3.2.11
          rails_version: 8.0.5.1
      - bundle_lint_test:
          name: bundle_ruby3-2_rails7-2
          ruby_version: 3.2.11
          rails_version: 7.2.4

  nightly:
    triggers:
      - schedule:
          cron: "0 0 * * *"
          filters:
            branches:
              only:
                - main
    jobs:
      # Ruby 4.0 releases
      - bundle_lint_test:
          name: bundle_ruby4-0_rails8-1
          ruby_version: 4.0.7
          rails_version: 8.1.4
      # Ruby 3.4 releases
      - bundle_lint_test:
          name: bundle_ruby3-4_rails8-1
          ruby_version: 3.4.11
          rails_version: 8.1.4
      # Ruby 3.3 releases
      - bundle_lint_test:
          name: bundle_ruby3-3_rails8-1
          ruby_version: 3.3.12
          rails_version: 8.1.4
      - bundle_lint_test:
          name: bundle_ruby3-3_rails8-0
          ruby_version: 3.3.12
          rails_version: 8.0.5.1
      - bundle_lint_test:
          name: bundle_ruby3-3_rails7-2
          ruby_version: 3.3.12
          rails_version: 7.2.4
      # Ruby 3.2 releases
      - bundle_lint_test:
          name: bundle_ruby3-2_rails8-0
          ruby_version: 3.2.11
          rails_version: 8.0.5.1
      - bundle_lint_test:
          name: bundle_ruby3-2_rails7-2
          ruby_version: 3.2.11
          rails_version: 7.2.4
